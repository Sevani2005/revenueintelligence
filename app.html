<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpendNest Revenue Intelligence Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* === GOOGLE FONTS === */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

/* === DESIGN TOKENS — Warm Ivory / Forest Green Theme === */
:root {
  /* Backgrounds */
  --color-bg:              #F8F6EF;
  --color-surface:         #FFFDF7;
  --color-surface-2:       #F2EFE6;
  --color-surface-3:       #EAE7DC;

  /* Borders */
  --color-border:          #E1E5DA;
  --color-border-subtle:   #EBEDe6;

  /* Text */
  --color-text-primary:    #243A33;
  --color-text-secondary:  #4A6359;
  --color-text-muted:      #718078;

  /* Accent — sage green */
  --color-accent:          #4A7C59;
  --color-accent-dim:      rgba(74,124,89,0.10);
  --color-accent-hover:    #3A6348;

  /* Semantic colours */
  --color-green:           #3D7A52;
  --color-green-dim:       rgba(61,122,82,0.10);
  --color-amber:           #B8840A;
  --color-amber-dim:       rgba(184,132,10,0.10);
  --color-red:             #B94040;
  --color-red-dim:         rgba(185,64,64,0.10);
  --color-purple:          #6B5B9E;
  --color-purple-dim:      rgba(107,91,158,0.10);
  --color-cyan:            #2A7F8F;
  --color-cyan-dim:        rgba(42,127,143,0.10);
  --color-orange:          #B8611A;
  --color-orange-dim:      rgba(184,97,26,0.10);
  --color-teal:            #207A6E;
  --color-teal-dim:        rgba(32,122,110,0.10);

  /* Sidebar-specific (deep forest green) */
  --sidebar-bg:            #183D34;
  --sidebar-border:        rgba(255,255,255,0.07);
  --sidebar-text:          #C8D8C2;
  --sidebar-text-muted:    rgba(200,216,194,0.55);
  --sidebar-active-bg:     rgba(168,190,150,0.18);
  --sidebar-active-text:   #A8BE96;
  --sidebar-hover-bg:      rgba(255,255,255,0.06);

  /* Shape / shadow */
  --radius-sm:  4px;
  --radius-md:  7px;
  --radius-lg:  10px;
  --shadow-sm:  0 1px 3px rgba(36,58,51,0.07);
  --shadow-md:  0 4px 12px rgba(36,58,51,0.09);
  --shadow-lg:  0 8px 24px rgba(36,58,51,0.13);

  --font:       'Inter', system-ui, -apple-system, sans-serif;
  --sidebar-w:  228px;
  --topbar-h:   52px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--color-bg);
  color: var(--color-text-primary);
  font-size: 13.5px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* === LAYOUT === */
#app { display: flex; height: 100vh; overflow: hidden; }
#sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#topbar {
  height: var(--topbar-h);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
  box-shadow: 0 1px 0 var(--color-border);
}
#content { flex: 1; overflow-y: auto; padding: 20px; }

/* === SIDEBAR === */
.sidebar-logo {
  padding: 18px 16px 12px;
  border-bottom: 1px solid var(--sidebar-border);
}
.sidebar-logo h1 {
  font-size: 14.5px;
  font-weight: 700;
  color: #E8F0E4;
  letter-spacing: -0.2px;
}
.sidebar-logo p {
  font-size: 10.5px;
  color: var(--sidebar-text-muted);
  margin-top: 3px;
}
.sidebar-nav { padding: 10px 0; flex: 1; }
.nav-section-label {
  padding: 10px 16px 4px;
  font-size: 9.5px;
  font-weight: 600;
  color: var(--sidebar-text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  cursor: pointer;
  color: var(--sidebar-text);
  font-size: 13px;
  font-weight: 400;
  border-left: 2px solid transparent;
  transition: all 0.12s;
  user-select: none;
  border-radius: 0;
}
.nav-item:hover {
  background: var(--sidebar-hover-bg);
  color: #E8F0E4;
}
.nav-item.active {
  background: var(--sidebar-active-bg);
  color: var(--sidebar-active-text);
  border-left-color: var(--sidebar-active-text);
  font-weight: 500;
}
.nav-item .badge {
  margin-left: auto;
  background: rgba(255,255,255,0.08);
  color: var(--sidebar-text-muted);
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 20px;
  text-align: center;
}
.nav-item.active .badge {
  background: rgba(168,190,150,0.20);
  color: var(--sidebar-active-text);
}
.nav-icon { font-size: 13px; width: 16px; text-align: center; opacity: 0.75; }
.nav-item.active .nav-icon { opacity: 1; }
.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid var(--sidebar-border);
}
.sidebar-footer p {
  font-size: 10.5px;
  color: var(--sidebar-text-muted);
  line-height: 1.5;
}
.sidebar-footer .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #A8BE96;
  margin-right: 5px;
}

/* === TOPBAR === */
.topbar-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text-primary);
  flex: 1;
  letter-spacing: -0.1px;
}
.topbar-search {
  display: flex;
  align-items: center;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 5px 10px;
  gap: 6px;
  width: 260px;
}
.topbar-search input {
  background: none;
  border: none;
  outline: none;
  color: var(--color-text-primary);
  font-size: 13px;
  width: 100%;
  font-family: var(--font);
}
.topbar-search input::placeholder { color: var(--color-text-muted); }

/* === BUTTONS === */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 13px;
  border-radius: var(--radius-md);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.13s;
  font-family: var(--font);
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.btn-primary {
  background: var(--color-accent);
  color: #fff;
  border-color: var(--color-accent);
}
.btn-primary:hover { background: var(--color-accent-hover); border-color: var(--color-accent-hover); }
.btn-secondary {
  background: var(--color-surface);
  color: var(--color-text-primary);
  border-color: var(--color-border);
}
.btn-secondary:hover { background: var(--color-surface-2); }
.btn-ghost {
  background: transparent;
  color: var(--color-text-secondary);
  border-color: transparent;
}
.btn-ghost:hover { background: var(--color-surface-2); color: var(--color-text-primary); }
.btn-danger {
  background: var(--color-red-dim);
  color: var(--color-red);
  border-color: rgba(185,64,64,0.25);
}
.btn-danger:hover { background: rgba(185,64,64,0.16); }
.btn-sm  { padding: 4px 9px;  font-size: 11.5px; }
.btn-xs  { padding: 2px 6px;  font-size: 11px; }

/* === CARDS === */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.card-title   { font-size: 13px; font-weight: 600; color: var(--color-text-primary); }
.card-subtitle{ font-size: 11.5px; color: var(--color-text-muted); margin-top: 2px; }

/* === STAT CARDS === */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 15px 16px;
  cursor: pointer;
  transition: border-color 0.14s, box-shadow 0.14s, transform 0.12s;
  box-shadow: var(--shadow-sm);
}
.stat-card:hover {
  border-color: var(--color-accent);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.stat-card.clickable-active {
  border-color: var(--color-accent);
  background: var(--color-accent-dim);
}
.stat-label {
  font-size: 10.5px;
  color: var(--color-text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 7px;
}
.stat-value {
  font-size: 26px;
  font-weight: 700;
  color: var(--color-text-primary);
  line-height: 1;
  margin-bottom: 5px;
  letter-spacing: -0.5px;
}
.stat-value.green  { color: var(--color-green); }
.stat-value.amber  { color: var(--color-amber); }
.stat-value.blue   { color: var(--color-accent); }
.stat-value.purple { color: var(--color-purple); }
.stat-meta   { font-size: 11px; color: var(--color-text-muted); }
.stat-meta b { color: var(--color-text-secondary); }

/* === BADGES / CHIPS === */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 20px;
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.badge-call        { background: var(--color-accent-dim);  color: var(--color-accent);  }
.badge-meeting     { background: var(--color-purple-dim);  color: var(--color-purple);  }
.badge-transcript  { background: var(--color-green-dim);   color: var(--color-green);   }
.badge-no-transcript { background: var(--color-surface-3); color: var(--color-text-muted); }
.badge-partner     { background: var(--color-purple-dim);  color: var(--color-purple);  }
.badge-deal        { background: var(--color-green-dim);   color: var(--color-green);   }
.badge-followup    { background: var(--color-cyan-dim);    color: var(--color-cyan);    }
.badge-research    { background: var(--color-amber-dim);   color: var(--color-amber);   }
.badge-support     { background: var(--color-red-dim);     color: var(--color-red);     }
.badge-training    { background: var(--color-teal-dim);    color: var(--color-teal);    }
.badge-review      { background: var(--color-orange-dim);  color: var(--color-orange);  }
.badge-no-content  { background: var(--color-surface-3);  color: var(--color-text-muted); }
.badge-manual      { background: var(--color-amber-dim);   color: var(--color-amber);   border: 1px solid rgba(184,132,10,0.25); }
.badge-stale       { background: var(--color-amber-dim);   color: var(--color-amber);   border: 1px solid rgba(184,132,10,0.25); }
.badge-fresh       { background: var(--color-green-dim);   color: var(--color-green);   }

/* === INBOX TABLE === */
.inbox-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.inbox-table { width: 100%; border-collapse: collapse; }
.inbox-table th {
  background: var(--color-surface-2);
  color: var(--color-text-muted);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--color-border);
  text-align: left;
  white-space: nowrap;
}
.inbox-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--color-border-subtle);
  font-size: 13px;
  vertical-align: middle;
}
.inbox-table tbody tr { cursor: pointer; transition: background 0.1s; }
.inbox-table tbody tr:hover { background: var(--color-surface-2); }
.inbox-table tbody tr.selected { background: var(--color-accent-dim); }
.inbox-table tbody tr td:first-child { font-weight: 500; color: var(--color-text-secondary); }
.ref-code     { font-family: 'SFMono-Regular', 'Consolas', monospace; font-size: 11.5px; color: var(--color-text-secondary); background: var(--color-surface-2); padding: 1px 5px; border-radius: 3px; border: 1px solid var(--color-border); }
.person-name  { font-weight: 500; color: var(--color-text-primary); }
.timestamp    { color: var(--color-text-muted); font-size: 12px; }
.routes-cell  { display: flex; flex-wrap: wrap; gap: 3px; }
.review-dot   { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.review-dot.pending      { background: var(--color-amber); }
.review-dot.reviewed     { background: var(--color-green); }
.review-dot.needs-review { background: var(--color-red); }

/* === DETAIL PANEL === */
.detail-panel {
  display: grid;
  grid-template-columns: 1fr 400px;
  gap: 16px;
  height: calc(100vh - var(--topbar-h) - 40px);
  overflow: hidden;
}
.detail-main    { overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.detail-sidebar { overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.detail-header  {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.detail-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.detail-header-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.detail-title { font-size: 16px; font-weight: 700; color: var(--color-text-primary); margin-bottom: 4px; letter-spacing: -0.2px; }
.detail-meta-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.detail-meta-item { }
.detail-meta-label { font-size: 10px; color: var(--color-text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 3px; }
.detail-meta-value { font-size: 13px; color: var(--color-text-primary); }

/* === ANALYSIS SECTION === */
.analysis-section {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.analysis-section-header {
  padding: 11px 16px;
  background: var(--color-surface-2);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.analysis-section-header:hover { background: var(--color-surface-3); }
.analysis-section-title { font-size: 12.5px; font-weight: 600; color: var(--color-text-primary); flex: 1; }
.analysis-section-body  { padding: 14px 16px; }
.analysis-item  { margin-bottom: 14px; }
.analysis-item:last-child { margin-bottom: 0; }
.analysis-label {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--color-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.analysis-content           { font-size: 13px; color: var(--color-text-primary); line-height: 1.65; }
.analysis-content.uncertain { color: var(--color-amber); }
.analysis-content.action    { color: var(--color-green); }
.evidence-cite {
  display: inline-block;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: 3px;
  padding: 0 5px;
  font-size: 10.5px;
  color: var(--color-text-secondary);
  font-family: monospace;
  cursor: pointer;
}
.evidence-cite:hover { background: var(--color-accent-dim); color: var(--color-accent); }

/* === TRANSCRIPT === */
.transcript-container {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.transcript-header {
  padding: 11px 16px;
  background: var(--color-surface-2);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.transcript-body { padding: 14px 16px; max-height: 420px; overflow-y: auto; }
.turn { margin-bottom: 14px; }
.turn:last-child { margin-bottom: 0; }
.turn-header { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.turn-number   { font-size: 10px; color: var(--color-text-muted); font-family: monospace; }
.turn-speaker  { font-size: 12px; font-weight: 600; }
.turn-speaker.team     { color: var(--color-accent); }
.turn-speaker.customer { color: var(--color-green); }
.turn-speaker.partner  { color: var(--color-purple); }
.turn-speaker.supplier { color: var(--color-amber); }
.turn-timecode { font-size: 10.5px; color: var(--color-text-muted); font-family: monospace; }
.turn-text {
  font-size: 13px;
  color: var(--color-text-primary);
  line-height: 1.65;
  padding-left: 10px;
  border-left: 2px solid var(--color-border);
}
.call-text     { font-size: 13px; color: var(--color-text-primary); line-height: 1.8; }
.no-transcript { padding: 24px; text-align: center; color: var(--color-text-muted); }
.no-transcript .icon { font-size: 28px; margin-bottom: 8px; }
.no-transcript p { font-size: 13px; }

/* === ROUTING PANEL === */
.routing-panel {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.routing-header {
  padding: 11px 16px;
  background: var(--color-surface-2);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.routing-body { padding: 14px 16px; }
.route-option {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: var(--radius-md);
  cursor: pointer;
  margin-bottom: 4px;
  transition: background 0.1s;
}
.route-option:hover   { background: var(--color-surface-2); }
.route-option.active  { background: var(--color-accent-dim); }
.route-option input[type=checkbox] { accent-color: var(--color-accent); width: 14px; height: 14px; cursor: pointer; }
.route-label       { font-size: 12.5px; color: var(--color-text-primary); flex: 1; }
.route-reason-text { font-size: 11.5px; color: var(--color-text-muted); margin-top: 4px; padding-left: 22px; line-height: 1.4; }

/* === BAR CHARTS === */
.bar-chart { display: flex; flex-direction: column; gap: 7px; }
.bar-row   { display: flex; align-items: center; gap: 8px; }
.bar-label { font-size: 11.5px; color: var(--color-text-secondary); width: 80px; flex-shrink: 0; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track {
  flex: 1;
  background: var(--color-surface-2);
  border-radius: 3px;
  height: 18px;
  overflow: hidden;
  position: relative;
  border: 1px solid var(--color-border);
}
.bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.4s ease;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 6px;
}
.bar-fill span { font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,0.9); white-space: nowrap; }
.bar-count { font-size: 11.5px; color: var(--color-text-muted); width: 24px; text-align: right; }

/* === MANAGER BRIEF === */
.brief-section {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.brief-header {
  padding: 13px 16px;
  background: linear-gradient(135deg, rgba(168,190,150,0.18) 0%, rgba(228,189,104,0.10) 100%);
  border-bottom: 1px solid var(--color-border);
}
.brief-date  { font-size: 11px; color: var(--color-text-muted); margin-bottom: 3px; }
.brief-title { font-size: 14px; font-weight: 700; color: var(--color-text-primary); letter-spacing: -0.1px; }
.brief-body  { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.brief-item  { display: flex; gap: 12px; }
.brief-icon  { font-size: 15px; flex-shrink: 0; width: 20px; margin-top: 2px; }
.brief-item-content { flex: 1; }
.brief-item-title { font-size: 13px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 3px; }
.brief-item-text  { font-size: 12.5px; color: var(--color-text-secondary); line-height: 1.55; }
.brief-item-link  { font-size: 11.5px; color: var(--color-accent); cursor: pointer; margin-top: 3px; font-weight: 500; }
.brief-item-link:hover { text-decoration: underline; }

/* === IMPORT / EXPORT === */
.import-zone {
  border: 2px dashed var(--color-border);
  border-radius: var(--radius-lg);
  padding: 32px;
  text-align: center;
  transition: all 0.15s;
  cursor: pointer;
}
.import-zone:hover,
.import-zone.dragover {
  border-color: var(--color-accent);
  background: var(--color-accent-dim);
}

/* ============================ STATE ============================ */
let STATE = {
  records: {},        // key: "source_type|source_id" -> { record_ref, source_type, source_id, payload, transcript_payload, appliedRevision }
  analysis: {},       // key: "source_type|source_id" -> { routes, manualRoutes, manualOverride, reviewStatus, analysisRevision }
  importLog: [],
  currentView: 'dashboard',
  selectedRecord: null,
  inboxFilter: { sourceType: 'all', route: 'all', search: '', person: 'all', hasTranscript: 'all' },
  lastExportTime: null
};

const STORAGE_KEY = 'ri_inbox_v3';

function stateKey(rec) { return `${rec.source_type}|${rec.source_id}`; }

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      STATE.records = saved.records || {};
      STATE.analysis = saved.analysis || {};
      STATE.importLog = saved.importLog || [];
    }
  } catch(e) { console.warn('State load error:', e); }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      records: STATE.records,
      analysis: STATE.analysis,
      importLog: STATE.importLog
    }));
  } catch(e) { console.warn('State save error:', e); }
}

function clearState() {
  STATE.records = {};
  STATE.analysis = {};
  STATE.importLog = [];
  saveState();
}

/* ============================ ANALYSIS HELPERS ============================ */
function getPregenAnalysis(source_type, source_id) {
  const key = `${source_type}|${source_id}`;
  return PRE_GENERATED_ANALYSIS[key] || null;
}

function initAnalysisForRecord(key, sourceType, sourceId, payload, transcript_payload, appliedRevision) {
  if (!STATE.analysis[key]) STATE.analysis[key] = {};
  const a = STATE.analysis[key];
  const pregen = getPregenAnalysis(sourceType, sourceId);

  // If there's no manual override, refresh analysis routes from pregen
  if (!a.manualOverride) {
    if (pregen) {
      a.routes = [...pregen.routes];
      a.routeReasons = { ...pregen.routeReasons };
    } else {
      a.routes = ['review'];
      a.routeReasons = { review: 'No usable transcript available; human review required.' };
    }
  }
  // Mark freshness
  a.analysisRevision = pregen ? pregen.rev : appliedRevision;
  a.currentSourceRevision = appliedRevision;
  a.analysisFresh = !pregen || (pregen.rev >= appliedRevision);

  // Set initial review status if not set
  if (!a.reviewStatus) a.reviewStatus = 'pending';
}

/* ============================ IMPORT ENGINE ============================ */
function processImportBatch(data) {
  const log = [];
  if (!data || !data.records || !Array.isArray(data.records)) {
    log.push({ type: 'err', msg: 'Invalid batch format: missing records array' });
    return log;
  }
  const batchRev = data.revision || 1;
  log.push({ type: 'info', msg: `Batch: ${data.batch_id} | Revision: ${batchRev} | Records: ${data.records.length}` });

  let added = 0, updated = 0, skipped = 0;
  for (const rec of data.records) {
    const key = stateKey(rec);
    const existing = STATE.records[key];

    if (existing) {
      const existingRev = existing.appliedRevision || 1;
      if (batchRev <= existingRev) {
        log.push({ type: 'warn', msg: `${rec.record_ref}: Rev ${batchRev} <= existing rev ${existingRev} — skipped` });
        skipped++;
        continue;
      }
      // Apply newer revision
      const hadTranscript = hasUsableTranscript(existing);
      STATE.records[key] = { ...rec, appliedRevision: batchRev };
      const hasNow = hasUsableTranscript(STATE.records[key]);
      const transcriptMsg = (!hadTranscript && hasNow) ? ' [TRANSCRIPT NOW AVAILABLE]' : '';
      log.push({ type: 'ok', msg: `${rec.record_ref}: Updated rev ${existingRev}→${batchRev}${transcriptMsg}` });
      // Mark analysis stale if transcript changed
      if (!hadTranscript && hasNow && STATE.analysis[key] && !STATE.analysis[key].manualOverride) {
        STATE.analysis[key].analysisFresh = false;
        STATE.analysis[key].analysisNote = 'Source text changed; analysis may need review.';
      }
      initAnalysisForRecord(key, rec.source_type, rec.source_id, rec.payload, rec.transcript_payload, batchRev);
      updated++;
    } else {
      STATE.records[key] = { ...rec, appliedRevision: batchRev };
      initAnalysisForRecord(key, rec.source_type, rec.source_id, rec.payload, rec.transcript_payload, batchRev);
      log.push({ type: 'ok', msg: `${rec.record_ref}: Added (rev ${batchRev})` });
      added++;
    }
  }
  log.push({ type: 'info', msg: `Done — added: ${added}, updated: ${updated}, skipped (same/older rev): ${skipped}` });
  log.push({ type: 'info', msg: `Total unique records: ${Object.keys(STATE.records).length}` });
  STATE.importLog.push(...log);
  saveState();
  return log;
}

function hasUsableTranscript(rec) {
  if (!rec) return false;
  const p = rec.payload;
  if (rec.source_type === 'call') return !!(p && p.transcript && p.transcript.trim());
  if (rec.source_type === 'meeting') {
    const tp = rec.transcript_payload;
    return !!(tp && tp.turns && tp.turns.length > 0 && tp.turns.some(t => t.text && t.text.trim()));
  }
  return false;
}

function getUsableTranscriptCount() {
  return Object.values(STATE.records).filter(hasUsableTranscript).length;
}

function getRecordList() {
  return Object.values(STATE.records).sort((a, b) => {
    const ta = new Date(a.source_type === 'call' ? a.payload.started_at : a.payload.starts_at).getTime();
    const tb = new Date(b.source_type === 'call' ? b.payload.started_at : b.payload.starts_at).getTime();
    return tb - ta;
  });
}

function getPersonForRecord(rec) {
  if (rec.source_type === 'call') return rec.payload.rep_name || rec.payload.rep_email || 'Unknown';
  if (rec.source_type === 'meeting') return rec.payload.organizer_email ? rec.payload.organizer_email.split('@')[0] : 'Unknown';
  return 'Unknown';
}

function getDateIST(rec) {
  const iso = rec.source_type === 'call' ? rec.payload.started_at : rec.payload.starts_at;
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: true });
}

function getRoutesForRecord(key) {
  const a = STATE.analysis[key];
  if (!a) return ['review'];
  if (a.manualOverride && a.manualRoutes) return a.manualRoutes;
  return a.routes || ['review'];
}

/* ============================ NAVIGATION ============================ */
function navigate(view, extra) {
  STATE.currentView = view;
  STATE.selectedRecord = extra || null;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.view === view);
  });
  document.getElementById('global-search-box').style.display = (view === 'inbox') ? 'flex' : 'none';
  updateTopbarTitle(view);
  renderView();
}

function updateTopbarTitle(view) {
  const titles = { dashboard: 'Dashboard — 21 August 2026', inbox: 'Conversation Inbox', import: 'Import Data', export: 'Export', detail: 'Conversation Detail' };
  document.getElementById('topbar-title').textContent = titles[view] || view;
}

/* ============================ RENDER DISPATCH ============================ */
function renderView() {
  const el = document.getElementById('content');
  if (STATE.currentView === 'dashboard') { el.innerHTML = renderDashboard(); bindDashboardEvents(); }
  else if (STATE.currentView === 'inbox') { el.innerHTML = renderInbox(); bindInboxEvents(); }
  else if (STATE.currentView === 'detail') { el.innerHTML = renderDetail(STATE.selectedRecord); bindDetailEvents(); }
  else if (STATE.currentView === 'import') { el.innerHTML = renderImport(); bindImportEvents(); }
  else if (STATE.currentView === 'export') { el.innerHTML = renderExport(); bindExportEvents(); }
}

function getFilteredRecords() {
  let records = getRecordList();
  const f = STATE.inboxFilter;
  if (f.sourceType !== 'all') records = records.filter(r => r.source_type === f.sourceType);
  if (f.hasTranscript === 'yes') records = records.filter(r => hasUsableTranscript(r));
  if (f.hasTranscript === 'no') records = records.filter(r => !hasUsableTranscript(r));
  if (f.route !== 'all') records = records.filter(r => getRoutesForRecord(stateKey(r)).includes(f.route));
  if (f.person !== 'all') records = records.filter(r => getPersonForRecord(r) === f.person);
  if (f.search) {
    const q = f.search.toLowerCase();
    records = records.filter(r => {
      const hasTx = hasUsableTranscript(r);
      return r.record_ref.toLowerCase().includes(q) ||
        getPersonForRecord(r).toLowerCase().includes(q) ||
        (r.payload.title || '').toLowerCase().includes(q) ||
        (r.source_type === 'call' && hasTx && (r.payload.transcript||'').toLowerCase().includes(q)) ||
        stateKey(r).toLowerCase().includes(q);
    });
  }
  return records;
}

function applyFilter(key, val) {

  renderView();

  STATE.inboxFilter.search = val;

function renderTranscriptPanel(rec) {
  const hasTx = hasUsableTranscript(rec);
  if (!hasTx) {
    let reason = 'No transcript text supplied for this record.';
    if (rec.source_type === 'meeting' && rec.transcript_payload && rec.transcript_payload.unavailable_reason) {
      reason = `Unavailable reason: ${rec.transcript_payload.unavailable_reason}`;
    }
    if (rec.source_type === 'call' && rec.payload.transcript === null) {
      reason = 'Call transcript is null (background call or not captured in this package).';
    }
    return `<div class="transcript-container"><div class="transcript-header"><span>📝</span><span style="font-size:12.5px;font-weight:600;color:var(--color-text-primary)">Transcript</span></div><div class="no-transcript"><div class="icon">📭</div><p>${reason}</p></div></div>`;
  }

  if (rec.source_type === 'call') {
    const text = rec.payload.transcript;
    return `<div class="transcript-container"><div class="transcript-header"><span>📞</span><span style="font-size:12.5px;font-weight:600;color:var(--color-text-primary)">Call Transcript</span><span class="text-xs text-muted" style="margin-left:auto">Plain text (no turn timing available)</span></div><div class="transcript-body"><div class="call-text">${escapeHtml(text)}</div></div></div>`;
  }

  // Meeting turns
  const turns = rec.transcript_payload.turns;
  return `<div class="transcript-container"><div class="transcript-header"><span>📅</span><span style="font-size:12.5px;font-weight:600;color:var(--color-text-primary)">Meeting Transcript</span><span class="text-xs text-muted" style="margin-left:auto">${turns.length} turns</span></div><div class="transcript-body">
    ${turns.map((t, i) => {
      const sClass = getSpeakerClass(t.speaker);
      return `<div class="turn" id="turn-${i+1}">
        <div class="turn-header">
          <span class="turn-number">Turn ${i+1}</span>
          <span class="turn-speaker ${sClass}">${escapeHtml(t.speaker)}</span>
          <span class="turn-timecode">${t.timecode}</span>
        </div>
        <div class="turn-text">${escapeHtml(t.text)}</div>
      </div>`;
    }).join('')}
  </div></div>`;
}

function getSpeakerClass(speaker) {
  if (!speaker) return '';
  const s = speaker.toLowerCase();
  if (s.includes('team')) return 'team';
  if (s.includes('customer')) return 'customer';
  if (s.includes('partner')) return 'partner';
  if (s.includes('supplier')) return 'supplier';
  return '';
}

function renderRoutingPanel(key, rec, a) {
  const routes = a.manualOverride && a.manualRoutes ? a.manualRoutes : (a.routes || ['review']);
  const pregen = getPregenAnalysis(rec.source_type, rec.source_id);
  return `<div class="routing-panel">
    <div class="routing-header">
      <span style="font-size:13px;font-weight:600;color:var(--color-text-primary)">Routing</span>
      ${a.manualOverride ? `<span class="badge badge-manual">✏ Manual</span>` : `<span class="badge badge-fresh">Auto</span>`}
    </div>
    <div class="routing-body">
      <div class="text-xs text-muted mb-2">Select to override routing. Corrections persist across imports and restarts.</div>
      ${Object.entries(ROUTE_DEFS).map(([routeKey, def]) => {
        const isActive = routes.includes(routeKey);
        const reason = (a.manualOverride && a.manualRouteReasons ? a.manualRouteReasons[routeKey] : null) || (pregen && pregen.routeReasons ? pregen.routeReasons[routeKey] : null);
        return `<div class="route-option ${isActive ? 'active' : ''}">
          <input type="checkbox" id="route-${key}-${routeKey}" ${isActive ? 'checked' : ''} onchange="toggleRoute('${key}','${routeKey}',this.checked)">
          <label for="route-${key}-${routeKey}" class="route-label" style="cursor:pointer"><span class="badge badge-${routeKey}" style="margin-right:4px">●</span>${def.label}</label>
        </div>
        ${reason && isActive ? `<div class="route-reason-text">↳ ${reason}</div>` : ''}`;
      }).join('')}
      <div class="divider"></div>
      <div style="display:flex;gap:6px">
        ${a.manualOverride ? `<button class="btn btn-ghost btn-xs" onclick="resetRouting('${key}')">↩ Reset to auto</button>` : ''}
        <button class="btn btn-secondary btn-xs" onclick="saveManualRoute('${key}')">Save routing</button>
      </div>
    </div>
  </div>`;
}

function renderMetadataPanel(rec) {
  const p = rec.payload;
  const rows = [];
  if (rec.source_type === 'call') {
    if (p.workspace_slug) rows.push(['Workspace', p.workspace_slug]);
    if (p.is_campaign_call !== null && p.is_campaign_call !== undefined) rows.push(['Campaign call', p.is_campaign_call ? 'Yes' : 'No']);
    if (p.prior_dials_ever !== null && p.prior_dials_ever !== undefined) rows.push(['Prior dials (source)', p.prior_dials_ever]);
    if (p.prior_connects_ever !== null && p.prior_connects_ever !== undefined) rows.push(['Prior connects (source)', p.prior_connects_ever]);
    if (p.speaker_count) rows.push(['Speaker count (source)', p.speaker_count]);
    if (p.talk_time_seconds) rows.push(['Talk time (source)', p.talk_time_seconds + 's']);
  } else {
    if (p.provider) rows.push(['Provider', p.provider]);
    if (p.recording_status) rows.push(['Recording status', p.recording_status]);
    if (p.has_transcript !== undefined) rows.push(['has_transcript flag', p.has_transcript ? 'Yes' : 'No']);
    if (p.attendee_count !== null && p.attendee_count !== undefined) rows.push(['Attendee count (metadata)', p.attendee_count]);
    if (p.duration_seconds) rows.push(['Duration (source)', p.duration_seconds + 's']);
  }
  return `<div class="card">
    <div class="card-header"><div class="card-title">Source Metadata</div></div>
    <table style="width:100%;border-collapse:collapse">
      ${rows.map(([k,v]) => `<tr><td style="padding:4px 0;color:var(--color-text-muted);font-size:11.5px;width:55%">${k}</td><td style="padding:4px 0;font-size:12px;color:var(--color-text-secondary)">${v}</td></tr>`).join('')}
    </table>
    <div class="divider"></div>
    <div class="text-xs text-muted">All values are source-reported metadata, not independently verified.</div>
  </div>`;
}

function toggleRoute(key, routeKey, checked) {
  // Just updates checkbox UI; actual save happens on "Save routing" or auto-persist
}

function saveManualRoute(key) {
  if (!STATE.analysis[key]) STATE.analysis[key] = {};
  const a = STATE.analysis[key];
  const checkboxes = document.querySelectorAll(`input[id^="route-${key}-"]`);
  const selectedRoutes = [];
  checkboxes.forEach(cb => {
    const rKey = cb.id.replace(`route-${key}-`, '');
    if (cb.checked) selectedRoutes.push(rKey);
  });
  if (selectedRoutes.length === 0) {
    showToast('Select at least one route', 'warning'); return;
  }
  a.manualRoutes = selectedRoutes;
  a.manualOverride = true;
  a.manualRouteReasons = {};
  const pregen = getPregenAnalysis(STATE.records[key]?.source_type, STATE.records[key]?.source_id);
  for (const r of selectedRoutes) {
    a.manualRouteReasons[r] = (pregen && pregen.routeReasons ? pregen.routeReasons[r] : null) || 'Manually assigned';
  }
  saveState();
  showToast(`Route saved for ${STATE.records[key]?.record_ref}`, 'success');
  renderView();
}

function resetRouting(key) {
  if (!STATE.analysis[key]) return;
  delete STATE.analysis[key].manualOverride;
  delete STATE.analysis[key].manualRoutes;
  delete STATE.analysis[key].manualRouteReasons;
  const rec = STATE.records[key];
  if (rec) {
    const pregen = getPregenAnalysis(rec.source_type, rec.source_id);
    if (pregen) {
      STATE.analysis[key].routes = [...pregen.routes];
      STATE.analysis[key].routeReasons = { ...pregen.routeReasons };
    }
  }
  saveState();
  showToast('Routing reset to auto', 'info');
  renderView();
}

function toggleReviewStatus(key) {
  if (!STATE.analysis[key]) STATE.analysis[key] = {};
  const a = STATE.analysis[key];
  a.reviewStatus = a.reviewStatus === 'reviewed' ? 'pending' : 'reviewed';
  saveState();
  renderView();
}

/* ============================ IMPORT VIEW ============================ */
function renderImport() {
  const logHtml = STATE.importLog.length > 0
    ? STATE.importLog.slice(-80).map(l => `<div class="log-${l.type}">[${l.type.toUpperCase()}] ${l.msg}</div>`).join('')
    : '<div class="log-info">No imports yet.</div>';

  return `
<div style="max-width:800px;display:flex;flex-direction:column;gap:16px">
  <div class="card">
    <div class="card-header"><div class="card-title">Import Data Files</div></div>
    <p class="text-sm text-muted mb-2">Import JSON batch files. Identity is (source_type, source_id). Same or older revisions are skipped. Manual routes are preserved.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
      <button class="btn btn-primary" onclick="loadInitialFile()">📥 Load 01_initial.json</button>

  <div class="card">

    <ol style="padding-left:20px;font-size:12.5px;color:var(--color-text-secondary);line-height:1.9">
      <li>Import 01_initial.json → 44 records, 17 usable transcripts</li>
      <li>Import 01_initial.json again → no duplicate records (same/older revision skipped)</li>
      <li>Manually change M07's route (via Inbox → M07 detail)</li>

  <div class="card">
    <div class="card-header"><div class="card-title">Data Management</div></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-danger btn-sm" onclick="if(confirm('Clear all imported data and reset?')){clearState();renderView();showToast('Data cleared','info')}">🗑 Clear All Data</button>
    </div>
    <div class="text-xs text-muted mt-2">Clearing removes all imported records and analysis. Source data files (in /data/) remain unchanged.</div>
  </div>
</div>`;
}

async function loadInitialFile() {
  try {
    const resp = await fetch('data/01_initial.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    const log = processImportBatch(data);
    showToast(`Imported 01_initial.json — ${log.filter(l=>l.type==='ok').length} processed`, 'success');
    renderView();
  } catch(e) {
    showToast(`Failed to load 01_initial.json: ${e.message}`, 'error');
    STATE.importLog.push({ type: 'err', msg: `File load error: ${e.message}` });
    saveState();
    renderView();
  }
}

async function loadUpdateFile() {
  try {
    const resp = await fetch('data/02_update.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    const log = processImportBatch(data);
    showToast(`Imported 02_update.json — M07 transcript now available`, 'success');
    renderView();
  } catch(e) {
    showToast(`Failed to load 02_update.json: ${e.message}`, 'error');
    STATE.importLog.push({ type: 'err', msg: `File load error: ${e.message}` });
    saveState();
    renderView();
  }
}

async function loadDemoData() {
  showToast('Loading demo data...', 'info');
  try {
    // Step 1: Load initial
    const r1 = await fetch('data/01_initial.json');
    const d1 = await r1.json();
    processImportBatch(d1);
    // Step 2: Re-import initial (should be idempotent)
    processImportBatch(d1);
    // Step 3: Load update
    const r2 = await fetch('data/02_update.json');
    const d2 = await r2.json();
    processImportBatch(d2);
    // Step 4: Re-import initial again (older revision should be ignored)
    processImportBatch(d1);
    showToast(`Demo loaded — ${Object.keys(STATE.records).length} unique records, ${getUsableTranscriptCount()} usable transcripts`, 'success');
    navigate('dashboard');
  } catch(e) {
    showToast(`Demo load failed: ${e.message}. Try Import view to load files manually.`, 'error');
    STATE.importLog.push({ type: 'err', msg: `Demo load error: ${e.message}` });
    saveState();
  }
}

function handleDragOver(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.add('dragover');
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) processJsonFile(file);
}

function handleFileInput(e) {
  const file = e.target.files[0];
  if (file) processJsonFile(file);
}

function processJsonFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      const log = processImportBatch(data);
      showToast(`Imported ${file.name}`, 'success');
      renderView();
    } catch(err) {
      showToast(`Invalid JSON: ${err.message}`, 'error');
    }
  };
  reader.readAsText(file);
}

  const records = getRecordList();
  const total = records.length;
  if (total === 0) {
    return `<div class="empty-state"><div class="icon">📭</div><h3>No data to export</h3><p>Import data first.</p></div>`;
  }

  return `
<div style="max-width:800px;display:flex;flex-direction:column;gap:16px">
  <div class="card">
    <div class="card-header"><div class="card-title">Export Manifests</div></div>
    <p class="text-sm text-muted mb-2">Generates JSON and CSV manifests covering all ${total} imported records. Each manifest includes: source_type, source_id, record_ref, applied_revision, routes, manual_override, review_status, has_transcript, analysis_fresh, output_path.</p>
    <div style="display:flex;gap:10px">

│       ├── B01_4868e5cd.txt
│       ├── B02_5747e4cd.txt  ... (20 background/voicemail calls)
└── meetings/

  <div class="card">
    <div class="card-header"><div class="card-title">Export Preview (first 10 records)</div></div>
    <div style="overflow-x:auto">
      <table class="inbox-table">
        <thead><tr><th>Record Ref</th><th>Source Type</th><th>Source ID (short)</th><th>Rev</th><th>Routes</th><th>Manual</th><th>Has Transcript</th><th>Status</th></tr></thead>
        <tbody>
          ${records.slice(0,10).map(rec => {

              <td>${rec.appliedRevision || 1}</td>
              <td>${routes.join(', ')}</td>
              <td>${a.manualOverride ? '✏ Yes' : 'No'}</td>

            </tr>`;
          }).join('')}
        </tbody>

function buildManifestData() {
  return getRecordList().map(rec => {
    const key = stateKey(rec);
    const a = STATE.analysis[key] || {};
    const routes = getRoutesForRecord(key);
    const hasTx = hasUsableTranscript(rec);
    const folder = rec.source_type === 'call' ? 'calls' : 'meetings';
    const subfolder = hasTx ? 'conversations' : 'no_content';
    const fname = `${rec.record_ref}_${rec.source_id.substring(0,8)}.txt`;
    return {
      record_ref: rec.record_ref,
      source_type: rec.source_type,
      source_id: rec.source_id,
      applied_revision: rec.appliedRevision || 1,
      routes: routes.join('|'),
      manual_override: a.manualOverride ? 'yes' : 'no',
      review_status: a.reviewStatus || 'pending',
      has_transcript: hasTx ? 'yes' : 'no',
      analysis_fresh: a.analysisFresh !== false ? 'yes' : 'no',
      output_path: `exports/${folder}/${subfolder}/${fname}`,
      privacy_flag: (PRE_GENERATED_ANALYSIS[key] && PRE_GENERATED_ANALYSIS[key].privacyFlag) ? 'yes' : 'no'
    };
  });
}

function exportJSON() {
  const manifest = buildManifestData();
  const obj = {
    generated_at: new Date().toISOString(),
    total_records: manifest.length,
    usable_transcripts: getUsableTranscriptCount(),
    note: 'All 44 selected records for 21 August 2026 (Asia/Kolkata). Analysis is pre-generated from supplied transcripts.',
    records: manifest
  };
  downloadText('manifest.json', JSON.stringify(obj, null, 2), 'application/json');
  showToast('JSON manifest downloaded', 'success');
}

function exportCSV() {
  const manifest = buildManifestData();
  const keys = Object.keys(manifest[0]);
  const rows = [keys.join(','), ...manifest.map(r => keys.map(k => JSON.stringify(r[k]||'')).join(','))];
  downloadText('manifest.csv', rows.join('\n'), 'text/csv');
  showToast('CSV manifest downloaded', 'success');
}

function downloadText(filename, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = filename;
  a.click();
}

function bindExportEvents() {}

/* ============================ UTILITIES ============================ */
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success: '✓', error: '✗', info: 'ℹ', warning: '⚠' };
  el.innerHTML = `<span>${icons[type]||'ℹ'}</span><span>${escapeHtml(msg)}</span>`;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 3500);
}

/* ============================ INIT ============================ */
document.addEventListener('DOMContentLoaded', () => {
  loadState();
  updateBadges();
  renderView();
});

function updateBadges() {
  const total = Object.keys(STATE.records).length;
  const el = document.getElementById('badge-inbox');
  if (el) el.textContent = total || '44';
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && STATE.currentView === 'detail') navigate('inbox');
});
